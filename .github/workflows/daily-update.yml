name: Update domain exports

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dyndns-daily-update
  cancel-in-progress: false

jobs:
  update-files:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/package.json

      - name: Install dependencies
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Install Puppeteer browser
        working-directory: scripts
        run: npx puppeteer browsers install chrome

      - name: Run tests
        working-directory: scripts
        run: npm test

      - name: Scrape providers and generate exports
        working-directory: scripts
        run: node main.js
        env:
          NOIP_USERNAME: ${{ secrets.NOIP_USERNAME }}
          NOIP_PASSWORD: ${{ secrets.NOIP_PASSWORD }}
          GSLB_USERNAME: ${{ secrets.GSLB_USERNAME }}
          GSLB_PASSWORD: ${{ secrets.GSLB_PASSWORD }}
          CLOUDDNS_USERNAME: ${{ secrets.CLOUDDNS_USERNAME }}
          CLOUDDNS_PASSWORD: ${{ secrets.CLOUDDNS_PASSWORD }}

      - name: Commit changes
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add README.md links.* scripts/data
          git diff --cached --quiet && exit 0
          git commit -m "chore: update dynamic DNS lists"
          git push
